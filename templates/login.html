<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | Personal Expense Tracker</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body><main class="container"><section class="panel">
  <h1>Login</h1>
  {% with messages = get_flashed_messages() %}{% for message in messages %}<p role="status">{{ message }}</p>{% endfor %}{% endwith %}
  <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="email">Email</label><input id="email" type="email" name="email" autocomplete="email" required>
    <label for="password">Password</label><input id="password" type="password" name="password" autocomplete="current-password" required>
    <button type="submit">Login</button>
  </form>
  <p>Don't have an account? <a href="{{ url_for('auth.register') }}">Register</a></p>
</section></main></body></html>
